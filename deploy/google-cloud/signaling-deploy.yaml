apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: webtorrent-signaling
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 1000
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/webtorrent-signaling:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: WS_PORT
          value: "8080"
        - name: ENABLE_DEBUG_LOGGING
          value: "false"
        - name: ENABLE_HTTPS
          value: "false"
        - name: MAX_MANIFEST_CHUNKS
          value: "20"
        resources:
          limits:
            cpu: "2"
            memory: "512Mi"
          requests:
            cpu: "1"
            memory: "256Mi"

