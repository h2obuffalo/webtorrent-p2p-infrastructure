name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [signaling, seeder]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci
      
      - name: Lint
        run: |
          cd ${{ matrix.service }}
          npm run lint || echo "No lint script"
      
      - name: Test
        run: |
          cd ${{ matrix.service }}
          npm test || echo "No test script"

