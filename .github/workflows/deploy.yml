name: Deploy to Google Cloud

on:
  push:
    branches: [ main ]
    paths:
      - 'signaling/**'
      - 'deploy/**'

jobs:
  deploy-signaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker
      
      - name: Build and push signaling image
        run: |
          docker build -f deploy/google-cloud/signaling-Dockerfile -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/webtorrent-signaling:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/webtorrent-signaling:${{ github.sha }}
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy webtorrent-signaling \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/webtorrent-signaling:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated

